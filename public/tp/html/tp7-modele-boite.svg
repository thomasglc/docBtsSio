<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="Le modèle de boîte : contenu, padding, bordure et margin">
  <!-- Mêmes couleurs que l'inspecteur de Chrome et d'Edge -->
  <rect x="10" y="10" width="620" height="360" rx="4" fill="#F9CC9D" stroke="#C98A4B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="26" y="38" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#7A4A12">margin</text>
  <text x="104" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#7A4A12">marge extérieure : écarte la boîte de ses voisines</text>

  <rect x="56" y="56" width="528" height="268" fill="#FDDD9B" stroke="#1A1A2E" stroke-width="2"/>
  <text x="72" y="82" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#5E4A06">border</text>
  <text x="142" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#5E4A06">bordure</text>

  <rect x="96" y="96" width="448" height="188" fill="#C3D08B"/>
  <text x="112" y="122" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#3D4A12">padding</text>
  <text x="192" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#3D4A12">marge intérieure : entre le contenu et la bordure</text>

  <rect x="150" y="140" width="340" height="104" fill="#8CB6C0"/>
  <text x="320" y="184" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#16343C">contenu</text>
  <text x="320" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#16343C">le texte, l'image… : <tspan font-family="Consolas, 'Courier New', monospace" font-weight="700">width</tspan> × <tspan font-family="Consolas, 'Courier New', monospace" font-weight="700">height</tspan></text>
</svg>
